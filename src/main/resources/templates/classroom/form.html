<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(#{classrooms.form.pageTitle}, ~{::main}, 'classrooms')}">
<body>
<main>
    <div class="page-header">
        <div>
            <h1 th:text="${classroomDto.id == null} ? #{classrooms.form.new} : #{classrooms.form.edit}">Classroom Form</h1>
            <div class="breadcrumb" th:text="#{classrooms.form.breadcrumb}">Home / Classrooms / Form</div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="${classroomDto.id == null} ? @{/classrooms} : @{/classrooms/update/{id}(id=${classroomDto.id})}"
                  th:object="${classroomDto}" method="post">

                <div class="form-group mb-3">
                    <label class="form-label" th:text="#{form.classroomName}">Classroom Name</label>
                    <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" th:placeholder="#{form.classroomName.placeholder}">
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>

                <div class="form-group mb-3">
                    <label class="form-label" th:text="#{table.capacity}">Capacity</label>
                    <input type="number" th:field="*{capacity}" class="form-control" th:classappend="${#fields.hasErrors('capacity')} ? 'is-invalid'" th:placeholder="#{form.capacity.placeholder}">
                    <div class="invalid-feedback" th:errors="*{capacity}"></div>
                </div>

                <div class="form-actions" style="margin-top: 1.5rem; display: flex; gap: 0.75rem;">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> <span th:text="#{btn.saveClassroom}">Save Classroom</span></button>
                    <a th:href="@{/classrooms}" class="btn btn-light"><i class="bi bi-x-lg"></i> <span th:text="#{btn.cancel}">Cancel</span></a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
