<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml"
      th:replace="~{layout/base :: layout('Classrooms', ~{::main}, 'classrooms')}">
<body>
<main>
    <div class="page-header">
        <div>
            <h1>Classrooms</h1>
            <div class="breadcrumb">Home / Classrooms</div>
        </div>
        <a th:href="@{/classrooms/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> New Classroom
        </a>
    </div>

    <div class="card">
        <div class="card-header">
            <h3>All classrooms <span class="badge badge-primary" th:text="${classrooms.totalElements}">0</span></h3>
            <form th:action="@{/classrooms}" method="get" class="search">
                <input type="text" name="keyword" th:value="${keyword}" placeholder="Search classroom...">
                <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i></button>
            </form>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Capacity</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="classroom : ${classrooms.content}">
                    <td th:text="${classroom.id}"></td>
                    <td>
                        <a th:href="@{/classrooms/{id}(id=${classroom.id})}">
                            <strong th:text="${classroom.name}"></strong>
                        </a>
                    </td>
                    <td>
                        <span class="badge badge-info" th:text="${classroom.capacity}"></span>
                    </td>
                    <td>
                        <div class="actions">
                            <a th:href="@{/classrooms/{id}(id=${classroom.id})}" class="btn btn-icon edit" title="Details">
                                <i class="bi bi-eye-fill"></i>
                            </a>
                            <a sec:authorize="hasRole('ADMIN')" th:href="@{/classrooms/edit/{id}(id=${classroom.id})}"
                               class="btn btn-icon edit" title="Edit">
                                <i class="bi bi-pencil-fill"></i>
                            </a>
                            <form sec:authorize="hasRole('ADMIN')" th:action="@{/classrooms/delete/{id}(id=${classroom.id})}"
                                  method="post" data-confirm="Delete this classroom?">
                                <button type="submit" class="btn btn-icon delete" title="Delete">
                                    <i class="bi bi-trash-fill"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${classrooms.empty}">
                    <td colspan="4" class="empty">
                        <i class="bi bi-inbox"></i> No classrooms found.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:replace="~{fragments/pagination :: pagination(${classrooms}, '/classrooms', ${keyword})}"></div>
    </div>
</main>
</body>
</html>
