<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(#{teachers.details.pageTitle}, ~{::main}, 'teachers')}">
<body>
<main>
    <div class="page-header">
        <div>
            <h1 th:text="${teacher.fullName}">Teacher</h1>
            <div class="breadcrumb" th:text="#{teachers.details.breadcrumb}">Home / Teachers / Details</div>
        </div>
        <div class="actions">
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/teachers/edit/{id}(id=${teacher.id})}"
               class="btn btn-primary"><i class="bi bi-pencil-fill"></i> <span th:text="#{btn.edit}">Edit</span></a>
            <a th:href="@{/teachers}" class="btn btn-light" th:text="#{btn.back}">Back</a>
        </div>
    </div>

    <!-- KPI cards -->
    <div class="stats">
        <div class="stat">
            <div class="stat-icon warning"><i class="bi bi-journal-bookmark-fill"></i></div>
            <div><h3 th:text="${teacher.courseCount}">0</h3><p th:text="#{dashboard.courses}">Courses</p></div>
        </div>
        <div class="stat">
            <div class="stat-icon primary"><i class="bi bi-people-fill"></i></div>
            <div><h3 th:text="${teacher.studentCount}">0</h3><p th:text="#{teachers.studentsTaught}">Students taught</p></div>
        </div>
        <div class="stat">
            <div class="stat-icon info"><i class="bi bi-clock-history"></i></div>
            <div><h3 th:text="${teacher.totalCredits}">0</h3><p th:text="#{teachers.totalCredits}">Total credits</p></div>
        </div>
        <div class="stat">
            <div class="stat-icon success"><i class="bi bi-graph-up"></i></div>
            <div>
                <h3 th:text="${teacher.overallAverage != null} ? ${#numbers.formatDecimal(teacher.overallAverage,1,2)} : '-'">-</h3>
                <p th:text="#{dashboard.averageGrade}">Average grade</p>
            </div>
        </div>
    </div>

    <!-- Profile -->
    <div class="card" style="margin-bottom:1.5rem">
        <div class="card-header"><h3 th:text="#{teacher.profile}">Profile</h3></div>
        <div class="card-body">
            <p><strong th:text="#{form.email} + ':'">Email:</strong> <span th:text="${teacher.email}"></span></p>
            <p><strong th:text="#{form.phone} + ':'">Phone:</strong> <span th:text="${teacher.phone ?: '-'}"></span></p>
            <p><strong th:text="#{form.specialization} + ':'">Specialization:</strong> <span th:text="${teacher.specialization ?: '-'}"></span></p>
            <p><strong th:text="#{form.gender} + ':'">Gender:</strong> <span th:text="${teacher.gender}"></span></p>
        </div>
    </div>

    <!-- Courses -->
    <div class="card">
        <div class="card-header"><h3 th:text="#{teachers.coursesTaught}">Courses taught</h3></div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th th:text="#{table.course}">Course</th>
                    <th th:text="#{table.credits}">Credits</th>
                    <th th:text="#{table.students}">Students</th>
                    <th th:text="#{table.classAverage}">Class average</th>
                    <th th:text="#{table.actions}">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${teacher.courses}">
                    <td><strong th:text="${c.title}"></strong></td>
                    <td><span class="badge badge-info" th:text="${c.credits} + ' cr.'"></span></td>
                    <td th:text="${c.studentCount}"></td>
                    <td>
                        <span class="badge badge-success"
                              th:text="${c.average != null} ? ${#numbers.formatDecimal(c.average,1,2)} + ' / 20' : '-'"></span>
                    </td>
                    <td>
                        <div class="actions">
                            <a th:href="@{/courses/{id}/grades(id=${c.courseId})}" class="btn btn-icon edit" th:title="#{title.grades}">
                                <i class="bi bi-journal-check"></i></a>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(teacher.courses)}">
                    <td colspan="5" class="empty"><i class="bi bi-inbox"></i> <span th:text="#{teachers.noCourses}">No courses assigned.</span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
