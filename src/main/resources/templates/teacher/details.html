<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout('Teacher Details', ~{::main}, 'teachers')}">
<body>
<main>
    <div class="page-header">
        <div>
            <h1 th:text="${teacher.fullName}">Teacher</h1>
            <div class="breadcrumb">Home / Teachers / Details</div>
        </div>
        <div class="actions">
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/teachers/edit/{id}(id=${teacher.id})}"
               class="btn btn-primary"><i class="bi bi-pencil-fill"></i> Edit</a>
            <a th:href="@{/teachers}" class="btn btn-light">Back</a>
        </div>
    </div>

    <!-- KPI cards -->
    <div class="stats">
        <div class="stat">
            <div class="stat-icon warning"><i class="bi bi-journal-bookmark-fill"></i></div>
            <div><h3 th:text="${teacher.courseCount}">0</h3><p>Courses</p></div>
        </div>
        <div class="stat">
            <div class="stat-icon primary"><i class="bi bi-people-fill"></i></div>
            <div><h3 th:text="${teacher.studentCount}">0</h3><p>Students taught</p></div>
        </div>
        <div class="stat">
            <div class="stat-icon info"><i class="bi bi-clock-history"></i></div>
            <div><h3 th:text="${teacher.totalCredits}">0</h3><p>Total credits</p></div>
        </div>
        <div class="stat">
            <div class="stat-icon success"><i class="bi bi-graph-up"></i></div>
            <div>
                <h3 th:text="${teacher.overallAverage != null} ? ${#numbers.formatDecimal(teacher.overallAverage,1,2)} : '-'">-</h3>
                <p>Average grade</p>
            </div>
        </div>
    </div>

    <!-- Profile -->
    <div class="card" style="margin-bottom:1.5rem">
        <div class="card-header"><h3>Profile</h3></div>
        <div class="card-body">
            <p><strong>Email:</strong> <span th:text="${teacher.email}"></span></p>
            <p><strong>Phone:</strong> <span th:text="${teacher.phone ?: '-'}"></span></p>
            <p><strong>Specialization:</strong> <span th:text="${teacher.specialization ?: '-'}"></span></p>
            <p><strong>Gender:</strong> <span th:text="${teacher.gender}"></span></p>
        </div>
    </div>

    <!-- Courses -->
    <div class="card">
        <div class="card-header"><h3>Courses taught</h3></div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr><th>Course</th><th>Credits</th><th>Students</th><th>Class average</th><th>Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="c : ${teacher.courses}">
                    <td><strong th:text="${c.title}"></strong></td>
                    <td><span class="badge badge-info" th:text="${c.credits} + ' cr.'"></span></td>
                    <td th:text="${c.studentCount}"></td>
                    <td>
                        <span class="badge badge-success"
                              th:text="${c.average != null} ? ${#numbers.formatDecimal(c.average,1,2)} + ' / 20' : '-'"></span>
                    </td>
                    <td>
                        <div class="actions">
                            <a th:href="@{/courses/{id}/grades(id=${c.courseId})}" class="btn btn-icon edit" title="Grades">
                                <i class="bi bi-journal-check"></i></a>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(teacher.courses)}">
                    <td colspan="5" class="empty"><i class="bi bi-inbox"></i> No courses assigned.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
