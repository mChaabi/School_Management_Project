<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(#{teachers.title}, ~{::main}, 'teachers')}">
<body>
<main>
    <div class="page-header">
        <div>
            <h1 th:text="#{teachers.title}">Teachers</h1>
            <div class="breadcrumb" th:text="#{teachers.breadcrumb}">Home / Teachers</div>
        </div>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/teachers/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> <span th:text="#{teachers.btn.new}">New Teacher</span>
        </a>
    </div>

    <div class="card">
        <div class="card-header">
            <h3><span th:text="#{teachers.all}">All teachers</span> <span class="badge badge-primary" th:text="${teachers.totalElements}">0</span></h3>
            <form th:action="@{/teachers}" method="get" class="search">
                <input type="text" name="keyword" th:value="${keyword}" th:placeholder="#{teachers.search.placeholder}">
                <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i></button>
            </form>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>#</th>
                    <th th:text="#{table.name}">Name</th>
                    <th th:text="#{table.email}">Email</th>
                    <th th:text="#{table.phone}">Phone</th>
                    <th th:text="#{table.specialization}">Specialization</th>
                    <th th:text="#{table.gender}">Gender</th>
                    <th th:text="#{table.actions}">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${teachers.content}">
                    <td th:text="${t.id}"></td>
                    <td>
                        <a th:href="@{/teachers/{id}(id=${t.id})}">
                            <strong th:text="${t.firstName + ' ' + t.lastName}"></strong></a>
                    </td>
                    <td th:text="${t.email}"></td>
                    <td th:text="${t.phone}"></td>
                    <td>
                        <span th:if="${t.specialization != null and !#strings.isEmpty(t.specialization)}"
                              class="badge badge-info" th:text="${t.specialization}"></span>
                        <span th:unless="${t.specialization != null and !#strings.isEmpty(t.specialization)}">-</span>
                    </td>
                    <td><span class="badge badge-primary" th:text="${t.gender}"></span></td>
                    <td>
                        <div class="actions">
                            <a th:href="@{/teachers/{id}(id=${t.id})}" class="btn btn-icon edit" th:title="#{title.details}">
                                <i class="bi bi-eye-fill"></i></a>
                            <a sec:authorize="hasRole('ADMIN')" th:href="@{/teachers/edit/{id}(id=${t.id})}"
                               class="btn btn-icon edit" th:title="#{title.edit}"><i class="bi bi-pencil-fill"></i></a>
                            <form sec:authorize="hasRole('ADMIN')" th:action="@{/teachers/delete/{id}(id=${t.id})}"
                                  method="post" th:attr="data-confirm=#{teachers.delete.confirm}">
                                <button type="submit" class="btn btn-icon delete" th:title="#{title.delete}">
                                    <i class="bi bi-trash-fill"></i></button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${teachers.empty}">
                    <td colspan="7" class="empty"><i class="bi bi-inbox"></i> <span th:text="#{teachers.empty}">No teachers found.</span></td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:replace="~{fragments/pagination :: pagination(${teachers}, '/teachers', ${keyword})}"></div>
    </div>
</main>
</body>
</html>
