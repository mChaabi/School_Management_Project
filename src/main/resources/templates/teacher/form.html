<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(#{teachers.form.pageTitle}, ~{::main}, 'teachers')}">
<body>
<main>
    <div class="page-header">
        <div>
            <h1 th:text="${teacherDto.id == null} ? #{teachers.form.new} : #{teachers.form.edit}"></h1>
            <div class="breadcrumb" th:text="#{teachers.form.breadcrumb}">Home / Teachers / Form</div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:object="${teacherDto}"
                  th:action="${teacherDto.id == null} ? @{/teachers} : @{/teachers/update/{id}(id=${teacherDto.id})}"
                  method="post">

                <div class="form-grid">
                    <div class="form-group">
                        <label><span th:text="#{form.firstName}">First name</span> <span class="req">*</span></label>
                        <input type="text" th:field="*{firstName}"
                               th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'">
                        <span class="error-text" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
                    </div>

                    <div class="form-group">
                        <label><span th:text="#{form.lastName}">Last name</span> <span class="req">*</span></label>
                        <input type="text" th:field="*{lastName}"
                               th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'">
                        <span class="error-text" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
                    </div>

                    <div class="form-group">
                        <label><span th:text="#{form.email}">Email</span> <span class="req">*</span></label>
                        <input type="email" th:field="*{email}"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                        <span class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                    </div>

                    <div class="form-group">
                        <label th:text="#{form.phone}">Phone</label>
                        <input type="text" th:field="*{phone}"
                               th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'">
                        <span class="error-text" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
                    </div>

                    <div class="form-group">
                        <label th:text="#{form.specialization}">Specialization</label>
                        <input type="text" th:field="*{specialization}"
                               th:classappend="${#fields.hasErrors('specialization')} ? 'is-invalid'">
                        <span class="error-text" th:if="${#fields.hasErrors('specialization')}" th:errors="*{specialization}"></span>
                    </div>

                    <div class="form-group">
                        <label><span th:text="#{form.gender}">Gender</span> <span class="req">*</span></label>
                        <select th:field="*{gender}"
                                th:classappend="${#fields.hasErrors('gender')} ? 'is-invalid'">
                            <option value="" th:text="#{form.select}">-- Select --</option>
                            <option value="MALE" th:text="#{gender.male}">Male</option>
                            <option value="FEMALE" th:text="#{gender.female}">Female</option>
                        </select>
                        <span class="error-text" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></span>
                    </div>
                </div>

                <div class="form-actions">
                    <a th:href="@{/teachers}" class="btn btn-light" th:text="#{btn.cancel}">Cancel</a>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> <span th:text="#{btn.save}">Save</span></button>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
