<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{resend.title}">Resend activation</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">   <!-- ajusta a tu CSS real -->
</head>
<body>
<div class="card" style="max-width:440px;margin:60px auto">
    <div class="card-body">
        <h2 th:text="#{resend.title}">Resend activation email</h2>
        <p th:text="#{resend.help}">Enter your email.</p>

        <div class="alert alert-success" th:if="${sent}">
            <i class="bi bi-check-circle-fill"></i> <span th:text="#{resend.sent}"></span>
        </div>

        <form th:action="@{/activation/resend}" method="post">
            <div class="form-group">
                <label th:text="#{form.email}">Email</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-actions">
                <a th:href="@{/login}" class="btn btn-light" th:text="#{btn.back}">Back</a>
                <button type="submit" class="btn btn-primary" th:text="#{resend.btn}">Send</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
