<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{users.form.pageTitle}">User Form - EduManage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h2 class="mb-4">
                        <i class="bi bi-person-plus-fill text-primary"></i>
                        <span th:text="${userId != null} ? #{users.form.edit} : #{users.form.new}">User Form</span>
                    </h2>

                    <!-- Error Alert -->
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <!-- Form bound to 'userDto' -->
                    <form th:action="${userId != null} ? @{/users/update/{id}(id=${userId})} : @{/users}"
                          th:object="${userDto}"
                          method="post">

                        <!-- Username -->
                        <div class="mb-3">
                            <label for="username" class="form-label" th:text="#{form.username}">Username</label>
                            <input type="text" id="username" class="form-control" th:field="*{username}" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label" th:text="#{form.email}">Email</label>
                            <input type="email" id="email" class="form-control" th:field="*{email}" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label for="password" class="form-label" th:text="#{form.password}">Password</label>
                            <input type="password" id="password" class="form-control" th:field="*{password}">
                            <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-save me-1"></i> <span th:text="#{btn.saveUser}">Save User</span>
                        </button>
                    </form>

                    <div class="mt-3 text-center">
                        <a th:href="@{/users}" class="text-decoration-none">
                            <i class="bi bi-arrow-left"></i> <span th:text="#{btn.backToUsersList}">Back to Users List</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
