<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{users.list.pageTitle}">Users Management - EduManage</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2><i class="bi bi-shield-lock-fill text-primary"></i> <span th:text="#{users.title}">Users Management</span></h2>
            <p class="text-muted" th:text="#{users.subtitle}">Manage system users, credentials, and roles.</p>
        </div>
        <a th:href="@{/users/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> <span th:text="#{users.btn.new}">Add New User</span>
        </a>
    </div>

    <!-- Success Message Alert -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Users Table Card -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th th:text="#{table.id}">#ID</th>
                        <th th:text="#{table.username}">Username</th>
                        <th th:text="#{table.email}">Email</th>
                        <th th:text="#{table.roles}">Roles</th>
                        <th th:text="#{table.status}">Status</th>
                        <th class="text-end" th:text="#{table.actions}">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Loop through users -->
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}">1</td>
                        <td>
                            <div class="fw-bold" th:text="${user.username}">john_doe</div>
                        </td>
                        <td th:text="${user.email}">john@example.com</td>
                        <td>
                                <span th:each="role : ${user.roles}"
                                      class="badge bg-secondary me-1"
                                      th:text="${role}">ROLE_ADMIN</span>
                        </td>
                        <td>
                            <span th:if="${user.enabled}" class="badge bg-success" th:text="#{status.active}">Active</span>
                            <span th:unless="${user.enabled}" class="badge bg-danger" th:text="#{status.disabled}">Disabled</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/users/edit/{id}(id=${user.id})}" class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil"></i> <span th:text="#{btn.edit}">Edit</span>
                            </a>
                            <a th:href="@{/users/delete/{id}(id=${user.id})}"
                               th:attr="onclick='return confirm(\'' + #{users.delete.confirm} + '\');'"
                               class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash"></i> <span th:text="#{btn.delete}">Delete</span>
                            </a>
                        </td>
                    </tr>
                    <!-- Empty State -->
                    <tr th:if="${users == null or users.empty}">
                        <td colspan="6" class="text-center py-4 text-muted">
                            <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                            <span th:text="#{users.empty}">No users found in the database.</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/dashboard}" class="text-decoration-none">
            <i class="bi bi-arrow-left"></i> <span th:text="#{btn.backToDashboard}">Back to Dashboard</span>
        </a>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
