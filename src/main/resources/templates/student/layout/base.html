<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content, menu)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | EduManage'">EduManage</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app">

    <aside th:replace="~{fragments/sidebar :: sidebar(${menu})}"></aside>

    <div class="main-wrapper">
        <header th:replace="~{fragments/header :: topbar(${title})}"></header>

        <div class="page-body">
            <!-- Flash messages (use RedirectAttributes in controllers) -->
            <div th:if="${success}" class="alert alert-success">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${success}"></span>
                <button type="button" class="alert-close">&times;</button>
            </div>
            <div th:if="${error}" class="alert alert-danger">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${error}"></span>
                <button type="button" class="alert-close">&times;</button>
            </div>

            <!-- The content of each page is inserted here -->
            <div th:insert="${content}"></div>
        </div>

        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</div>
<div class="overlay" id="overlay"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
