<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Classroom List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2>Classrooms Management</h2>
<hr>

<div class="mb-3 text-end">
    <a th:href="@{/classrooms/new}" class="btn btn-primary">Add New Classroom</a>
</div>

<table class="table table-striped table-bordered">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Capacity</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="classroom : ${classrooms.content}">
        <td th:text="${classroom.id}"></td>
        <td th:text="${classroom.name}"></td>
        <td th:text="${classroom.capacity}"></td>
        <td>
            <a th:href="@{/classrooms/edit/{id}(id=${classroom.id})}" class="btn btn-sm btn-warning">Edit</a>
            <a th:href="@{/classrooms/delete/{id}(id=${classroom.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')">Delete</a>
        </td>
    </tr>
    <tr th:if="${classrooms.empty}">
        <td colspan="4" class="text-center">No classrooms found</td>
    </tr>
    </tbody>
</table>

</body>
</html>
