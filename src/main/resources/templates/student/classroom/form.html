<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Classroom Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<div class="card shadow">
    <div class="card-header bg-primary text-white">
        <h3 th:text="${classroomDto.id == null} ? 'Add New Classroom' : 'Edit Classroom'">Classroom Form</h3>
    </div>
    <div class="card-body">

        <form th:action="${classroomDto.id == null} ? @{/classrooms} : @{/classrooms/update/{id}(id=${classroomDto.id})}"
              th:object="${classroomDto}" method="post">

            <div class="mb-3">
                <label class="form-label">Classroom Name</label>
                <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{name}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Capacity</label>
                <input type="number" th:field="*{capacity}" class="form-control" th:classappend="${#fields.hasErrors('capacity')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{capacity}"></div>
            </div>

            <button type="submit" class="btn btn-success">Save</button>
            <a th:href="@{/classrooms}" class="btn btn-secondary">Cancel</a>
        </form>

    </div>
</div>

</body>
</html>
