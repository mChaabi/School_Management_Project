<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Not found', ~{::main}, '')}">
<body>
<main>
    <div class="card error-page">
        <h1>404</h1>
        <p th:text="${message} ?: 'The page you are looking for does not exist.'"></p>
        <a th:href="@{/}" class="btn btn-primary"><i class="bi bi-house"></i> Back to dashboard</a>
    </div>
</main>
</body>
</html>
