<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(#{students.title}, ~{::main}, 'students')}">
<body>
<main>
    <div class="page-header">
        <div>
            <h1 th:text="#{students.title}">Students</h1>
            <div class="breadcrumb" th:text="#{students.breadcrumb}">Home / Students</div>
        </div>
        <a sec:authorize="hasAnyRole('ADMIN','TEACHER')" th:href="@{/export/students.xlsx}" class="btn btn-light">
            <i class="bi bi-file-earmark-excel-fill"></i> <span th:text="#{btn.excel}">Excel</span></a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/import/students}" class="btn btn-light">
            <i class="bi bi-upload"></i> <span th:text="#{import.menu}">Import</span></a>
        <a sec:authorize="hasAnyRole('ADMIN','TEACHER')" th:href="@{/export/students.csv}" class="btn btn-light">
            <i class="bi bi-filetype-csv"></i> <span th:text="#{btn.csv}">CSV</span></a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/students/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> <span th:text="#{students.btn.new}">New Student</span>
        </a>
    </div>

    <div class="card">
        <div class="card-header">
            <h3><span th:text="#{students.all}">All students</span> <span class="badge badge-primary" th:text="${students.totalElements}">0</span></h3>
            <form th:action="@{/students}" method="get" class="search">
                <input type="text" name="keyword" th:value="${keyword}" th:placeholder="#{students.search.placeholder}">
                <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i></button>
            </form>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>#</th>
                    <th th:text="#{table.name}">Name</th>
                    <th th:text="#{table.email}">Email</th>
                    <th th:text="#{table.phone}">Phone</th>
                    <th th:text="#{table.birthDate}">Birth date</th>
                    <th th:text="#{table.gender}">Gender</th>
                    <th th:text="#{table.actions}">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${students.content}">
                    <td th:text="${s.id}"></td>

                    <td>
                        <a th:href="@{/students/{id}(id=${s.id})}">
                            <strong th:text="${s.firstName + ' ' + s.lastName}"></strong>
                        </a>
                    </td>

                    <td th:text="${s.email}"></td>
                    <td th:text="${s.phone}"></td>
                    <td th:text="${s.birthDate != null} ? ${#temporals.format(s.birthDate, 'dd/MM/yyyy')} : '-'"></td>
                    <td><span class="badge badge-primary" th:text="${s.gender}"></span></td>
                    <td>
                        <div class="actions">
                            <a th:href="@{/students/{id}(id=${s.id})}" class="btn btn-icon edit" th:title="#{title.details}">
                                <i class="bi bi-eye-fill"></i></a>

                            <a th:href="@{/students/{id}/report-card(id=${s.id})}" class="btn btn-icon edit" th:title="#{title.reportCard}">
                                <i class="bi bi-file-earmark-pdf-fill"></i></a>

                            <a th:href="@{/attendances/student/{id}(id=${s.id})}" class="btn btn-icon edit"
                               th:title="#{title.attendance}"><i class="bi bi-calendar-check"></i></a>

                            <a sec:authorize="hasRole('ADMIN')"
                               th:href="@{/students/edit/{id}(id=${s.id})}" class="btn btn-icon edit" th:title="#{title.edit}">
                                <i class="bi bi-pencil-fill"></i></a>
                            <form sec:authorize="hasRole('ADMIN')"
                                  th:action="@{/students/delete/{id}(id=${s.id})}" method="post"
                                  th:attr="data-confirm=#{students.delete.confirm}">
                                <button type="submit" class="btn btn-icon delete" th:title="#{title.delete}">
                                    <i class="bi bi-trash-fill"></i></button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${students.empty}">
                    <td colspan="7" class="empty"><i class="bi bi-inbox"></i> <span th:text="#{students.empty}">No students found.</span></td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:replace="~{fragments/pagination :: pagination(${students}, '/students', ${keyword})}"></div>
    </div>
</main>
</body>
</html>
