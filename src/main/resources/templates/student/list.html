<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Students', ~{::main}, 'students')}">
<body>
<main>
    <div class="page-header">
        <div>
            <h1>Students</h1>
            <div class="breadcrumb">Home / Students</div>
        </div>
        <a th:href="@{/students/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> New Student
        </a>
    </div>

    <div class="card">
        <div class="card-header">
            <h3>All students <span class="badge badge-primary" th:text="${students.totalElements}">0</span></h3>
            <form th:action="@{/students}" method="get" class="search">
                <input type="text" name="keyword" th:value="${keyword}" placeholder="Search student...">
                <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i></button>
            </form>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                <tr><th>#</th><th>Name</th><th>Email</th><th>Phone</th>
                    <th>Birth date</th><th>Gender</th><th>Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="s : ${students.content}">
                    <td th:text="${s.id}"></td>
                    <td><strong th:text="${s.firstName + ' ' + s.lastName}"></strong></td>
                    <td th:text="${s.email}"></td>
                    <td th:text="${s.phone}"></td>
                    <td th:text="${s.birthDate != null} ? ${#temporals.format(s.birthDate, 'dd/MM/yyyy')} : '-'"></td>
                    <td><span class="badge badge-primary" th:text="${s.gender}"></span></td>
                    <td>
                        <div class="actions">
                            <a th:href="@{/attendance/student/{id}(id=${s.id})}" class="btn btn-icon edit"
                               title="Attendance"><i class="bi bi-calendar-check"></i></a>
                            <a th:href="@{/students/edit/{id}(id=${s.id})}" class="btn btn-icon edit" title="Edit">
                                <i class="bi bi-pencil-fill"></i></a>
                            <form th:action="@{/students/delete/{id}(id=${s.id})}" method="post"
                                  data-confirm="Delete this student?">
                                <button type="submit" class="btn btn-icon delete" title="Delete">
                                    <i class="bi bi-trash-fill"></i></button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${students.empty}">
                    <td colspan="7" class="empty"><i class="bi bi-inbox"></i> No students found.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:replace="~{fragments/pagination :: pagination(${students}, '/students', ${keyword})}"></div>
    </div>
</main>
</body>
</html>
