<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Course Form', ~{::main}, 'courses')}">
<body>
<main>

    <div class="page-header">
        <div>
            <h1 th:text="${courseDto.id == null} ? 'New Course' : 'Edit Course'"></h1>
            <div class="breadcrumb">Home / Courses / Form</div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <!-- Create → POST /courses | Edit → POST /courses/update/{id} -->
            <form th:object="${courseDto}"
                  th:action="${courseDto.id == null} ? @{/courses} : @{/courses/update/{id}(id=${courseDto.id})}"
                  method="post">

                <div class="form-grid">
                    <div class="form-group">
                        <label>Title <span class="req">*</span></label>
                        <input type="text" th:field="*{title}"
                               th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
                        <span class="error-text" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
                    </div>

                    <div class="form-group">
                        <label>Credits <span class="req">*</span></label>
                        <input type="number" th:field="*{credits}"
                               th:classappend="${#fields.hasErrors('credits')} ? 'is-invalid'">
                        <span class="error-text" th:if="${#fields.hasErrors('credits')}" th:errors="*{credits}"></span>
                    </div>

                    <div class="form-group">
                        <label>Teacher</label>
                        <select th:field="*{teacherId}">
                            <option value="">-- Select teacher --</option>
                            <option th:each="t : ${teachers}" th:value="${t.id}"
                                    th:text="${t.firstName + ' ' + t.lastName}"></option>
                        </select>
                        <span class="error-text" th:if="${#fields.hasErrors('teacherId')}" th:errors="*{teacherId}"></span>
                    </div>

                    <div class="form-group full">
                        <label>Description</label>
                        <textarea th:field="*{description}"></textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <a th:href="@{/courses}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i> Save
                    </button>
                </div>
            </form>
        </div>
    </div>

</main>
</body>
</html>
