<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="sidebar" id="sidebar" th:fragment="sidebar(menu)">
    <div class="brand">
        <i class="bi bi-mortarboard-fill"></i>
        <span>EduManage</span>
    </div>

    <nav class="menu">
        <span class="menu-title">Main</span>
        <a th:href="@{/}" th:classappend="${menu == 'home'} ? 'active'">
            <i class="bi bi-speedometer2"></i> Dashboard</a>

        <span class="menu-title">Academic</span>
        <a th:href="@{/students}" th:classappend="${menu == 'students'} ? 'active'">
            <i class="bi bi-people-fill"></i> Students</a>
        <a th:href="@{/teachers}" th:classappend="${menu == 'teachers'} ? 'active'">
            <i class="bi bi-person-workspace"></i> Teachers</a>
        <a th:href="@{/courses}" th:classappend="${menu == 'courses'} ? 'active'">
            <i class="bi bi-journal-bookmark-fill"></i> Courses</a>
        <a th:href="@{/classrooms}" th:classappend="${menu == 'classrooms'} ? 'active'">
            <i class="bi bi-door-open-fill"></i> Classrooms</a>
        <a th:href="@{/enrollments}" th:classappend="${menu == 'enrollments'} ? 'active'">
            <i class="bi bi-card-checklist"></i> Enrollments</a>

        <span class="menu-title">Daily</span>
        <a th:href="@{/attendance}" th:classappend="${menu == 'attendance'} ? 'active'">
            <i class="bi bi-calendar-check-fill"></i> Attendance</a>
    </nav>

    <div class="sidebar-footer">
        <i class="bi bi-shield-check"></i> v1.0.0
    </div>
</aside>
</body>
</html>
