<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(#{students.details.pageTitle}, ~{::main}, 'students')}">
<body>
<main>
    <div class="page-header">
        <div>
            <h1 th:text="${student.fullName}">Student</h1>
            <div class="breadcrumb" th:text="#{students.details.breadcrumb}">Home / Students / Details</div>
        </div>
        <div class="actions">
            <a th:href="@{/students/{id}/report-card(id=${student.id})}" class="btn btn-primary">
                <i class="bi bi-file-earmark-pdf-fill"></i> <span th:text="#{btn.reportCard}">Report card</span>
            </a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/students/edit/{id}(id=${student.id})}"
               class="btn btn-primary"><i class="bi bi-pencil-fill"></i> <span th:text="#{btn.edit}">Edit</span></a>
            <a sec:authorize="hasAnyRole('ADMIN','TEACHER')" th:href="@{/students}"
               class="btn btn-light" th:text="#{btn.back}">Back</a>
        </div>
    </div>

    <!-- Profile + classroom -->
    <div class="stats">
        <div class="card"><div class="card-body">
            <h3 th:text="#{student.profile}">Profile</h3>
            <p><strong th:text="#{form.email} + ':'">Email:</strong> <span th:text="${student.email}"></span></p>
            <p><strong th:text="#{form.phone} + ':'">Phone:</strong> <span th:text="${student.phone ?: '-'}"></span></p>
            <p><strong th:text="#{form.city} + ':'">City:</strong> <span th:text="${student.city ?: '-'}"></span></p>
            <p><strong th:text="#{form.country} + ':'">Country:</strong> <span th:text="${student.country ?: '-'}"></span></p>
            <p><strong th:text="#{form.gender} + ':'">Gender:</strong> <span th:text="${student.gender}"></span></p>
            <p><strong th:text="#{form.birthDate} + ':'">Birth date:</strong>
                <span th:text="${student.birthDate != null} ? ${#temporals.format(student.birthDate,'dd/MM/yyyy')} : '-'"></span></p>
        </div></div>

        <div class="card"><div class="card-body">
            <h3 th:text="#{form.classroom}">Classroom</h3>
            <p th:if="${student.classroomName == null}" th:text="#{student.notAssigned}">Not assigned</p>
            <div th:if="${student.classroomName != null}">
                <p><strong th:text="${student.classroomName}"></strong></p>
                <p><span th:text="#{student.capacity}">Capacity</span>: <span th:text="${student.classroomCapacity}"></span></p>
            </div>
        </div></div>

        <div class="card"><div class="card-body">
            <h3 th:text="#{dashboard.averageGrade}">Average grade</h3>
            <p style="font-size:2rem;font-weight:700"
               th:text="${student.average != null} ? ${#numbers.formatDecimal(student.average,1,2)} + ' / 20' : '-'">-</p>
        </div></div>
    </div>

    <!-- Courses + teachers -->
    <div class="card">
        <div class="card-header">
            <h3><span th:text="#{student.coursesAndTeachers}">Courses and teachers</span>
                <span class="badge badge-primary" th:text="${#lists.size(student.courses)}">0</span></h3>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th th:text="#{table.course}">Course</th>
                    <th th:text="#{table.credits}">Credits</th>
                    <th th:text="#{table.teacher}">Teacher</th>
                    <th th:text="#{table.enrolledOn}">Enrolled on</th>
                    <th th:text="#{table.grade}">Grade</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${student.courses}">
                    <td><strong th:text="${c.courseTitle}"></strong></td>
                    <td><span class="badge badge-info" th:text="${c.credits} + ' cr.'"></span></td>
                    <td>
                        <span th:text="${c.teacherName}"></span>
                        <small th:if="${c.specialization != null}" th:text="' (' + ${c.specialization} + ')'"></small>
                    </td>
                    <td th:text="${c.enrollmentDate != null} ? ${#temporals.format(c.enrollmentDate,'dd/MM/yyyy')} : '-'"></td>
                    <td><span class="badge badge-success" th:text="${c.grade != null} ? ${c.grade} : '-'"></span></td>
                </tr>
                <tr th:if="${#lists.isEmpty(student.courses)}">
                    <td colspan="5" class="empty"><i class="bi bi-inbox"></i> <span th:text="#{student.notEnrolled}">Not enrolled in any course.</span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
