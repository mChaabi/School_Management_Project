<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Student Form', ~{::main}, 'students')}">
<body>
<main>
    <div class="page-header">
        <div>
            <h1 th:text="${studentDto.id == null} ? 'New Student' : 'Edit Student'"></h1>
            <div class="breadcrumb">Home / Students / Form</div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:object="${studentDto}"
                  th:action="${studentDto.id == null} ? @{/students} : @{/students/update/{id}(id=${studentDto.id})}"
                  method="post">

                <div class="form-grid">
                    <div class="form-group">
                        <label>First name <span class="req">*</span></label>
                        <input type="text" th:field="*{firstName}"
                               th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'">
                        <span class="error-text" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
                    </div>

                    <div class="form-group">
                        <label>Last name <span class="req">*</span></label>
                        <input type="text" th:field="*{lastName}"
                               th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'">
                        <span class="error-text" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
                    </div>

                    <div class="form-group">
                        <label>Email <span class="req">*</span></label>
                        <input type="email" th:field="*{email}"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                        <span class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                    </div>

                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" th:field="*{phone}"
                               th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'">
                        <span class="error-text" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
                    </div>
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" th:field="*{city}"
                               th:classappend="${#fields.hasErrors('city')} ? 'is-invalid'">
                        <span class="error-text" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></span>
                    </div>

                    <div class="form-group">
                        <label>Country</label>
                        <input type="text" th:field="*{country}"
                               th:classappend="${#fields.hasErrors('country')} ? 'is-invalid'">
                        <span class="error-text" th:if="${#fields.hasErrors('country')}" th:errors="*{country}"></span>
                    </div>

                    <div class="form-group">
                        <label>Birth date</label>
                        <input type="date" th:field="*{birthDate}"
                               th:classappend="${#fields.hasErrors('birthDate')} ? 'is-invalid'">
                        <span class="error-text" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></span>
                    </div>

                    <div class="form-group">
                        <label>Gender</label>
                        <select th:field="*{gender}"
                                th:classappend="${#fields.hasErrors('gender')} ? 'is-invalid'">
                            <option value="">-- Select --</option>
                            <option value="MALE">Male</option>
                            <option value="FEMALE">Female</option>
                        </select>
                        <span class="error-text" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></span>
                    </div>

                    <div class="form-group">
                        <label>Classroom</label>
                        <select th:field="*{classroomId}">
                            <option value="">-- No classroom --</option>
                            <option th:each="c : ${classrooms}" th:value="${c.id}" th:text="${c.name}"></option>
                        </select>
                        <span class="error-text" th:if="${#fields.hasErrors('classroomId')}" th:errors="*{classroomId}"></span>
                    </div>
                </div>

                <div class="form-actions">
                    <a th:href="@{/students}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save</button>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
