<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(#{courses.grades.pageTitle}, ~{::main}, 'courses')}">
<body>
<main>

    <div class="page-header">
        <div>
            <h1 th:text="#{courses.grades.heading} + ' ' + ${courseTitle}">Course Grades</h1>
            <div class="breadcrumb" th:text="#{courses.grades.breadcrumb}">Home / Courses / Grades</div>
        </div>
    </div>

    <div class="card">
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th th:text="#{table.course}">Course</th>
                    <th th:text="#{table.teacher}">Teacher</th>
                    <th th:text="#{table.student}">Student</th>
                    <th th:text="#{table.examTitle}">Exam Title</th>
                    <th th:text="#{table.score}">Note / Score</th>
                    <th th:text="#{table.date}">Date</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="g : ${grades}">
                    <td th:text="${g.courseName}">Database Design</td>
                    <td th:text="${g.teacherName != null ? g.teacherName : 'N/A'}">Rahmouni Oussama</td>
                    <td th:text="${g.studentName}">John Doe</td>
                    <td th:text="${g.examTitle}">Midterm Exam</td>
                    <td>
                        <span th:if="${g.absent}" class="badge badge-danger" th:text="#{badge.absent}">Absent</span>
                        <strong th:if="${!g.absent}"
                                th:text="${g.score != null ? g.score + ' / ' + g.maxScore : #{status.notGraded}}">
                            15.0 / 20.0
                        </strong>
                    </td>
                    <td th:text="${#temporals.format(g.examDate,'dd/MM/yyyy')}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(grades)}">
                    <td colspan="6" class="empty" th:text="#{grades.empty}">No grades or exam results found for this course.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>
</body>
</html>
