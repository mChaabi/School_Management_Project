<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Exam paper', ~{::main}, 'exams')}">
<body>
<main>
    <div class="page-header">
        <div>
            <h1 th:text="'Exam paper: ' + ${exam.title}">Exam paper</h1>
            <div class="breadcrumb" th:text="'Home / Exams / ' + ${exam.courseTitle}">Course</div>
        </div>
        <div class="actions">
            <a th:href="@{/exams/{id}/grades(id=${exam.id})}" class="btn btn-light">
                <i class="bi bi-pencil-square"></i> Enter scores</a>
            <a th:href="@{/exams}" class="btn btn-light">Back to exams</a>
        </div>
    </div>

    <div class="card" style="margin-bottom:1.5rem"><div class="card-body">
        <div class="ex-chips">
            <span class="ex-chip"><i class="bi bi-journal-bookmark-fill"></i> <strong th:text="${exam.courseTitle}"></strong></span>
            <span class="ex-chip"><i class="bi bi-calendar-event"></i> <strong th:text="${#temporals.format(exam.date,'dd/MM/yyyy')}"></strong></span>
            <span class="ex-chip"><i class="bi bi-trophy"></i> Max <strong th:text="${exam.maxScore}"></strong></span>
            <span class="ex-chip"><i class="bi bi-percent"></i> Weight <strong th:text="${exam.weight} + '%'"></strong></span>
        </div>
    </div></div>

    <!-- Current file -->
    <div class="card" style="margin-bottom:1.5rem" th:if="${file != null}">
        <div class="card-header"><h3>Current file</h3></div>
        <div class="card-body">
            <div class="ex-file">
                <div class="ex-file-icon"><i class="bi bi-file-earmark-text-fill"></i></div>
                <div class="ex-file-info">
                    <strong th:text="${file.fileName}">exam.pdf</strong>
                    <small>
                        <span th:text="${#numbers.formatDecimal(file.size / 1024.0, 1, 1)} + ' KB'"></span> &middot;
                        uploaded <span th:text="${#temporals.format(file.uploadedAt,'dd/MM/yyyy HH:mm')}"></span>
                        by <span th:text="${file.uploadedBy}"></span>
                    </small>
                    <span class="badge badge-success" th:if="${file.published}">Visible to students</span>
                    <span class="badge badge-info" th:unless="${file.published}">Hidden from students</span>
                </div>
                <div class="ex-file-actions">
                    <a th:href="@{/exams/{id}/paper/view(id=${exam.id})}" target="_blank" class="btn btn-light">
                        <i class="bi bi-eye-fill"></i> Open</a>
                    <a th:href="@{/exams/{id}/paper/download(id=${exam.id})}" class="btn btn-light">
                        <i class="bi bi-download"></i> Download</a>

                    <form th:action="@{/exams/{id}/paper/publish(id=${exam.id})}" method="post">
                        <input type="hidden" name="publish" th:value="${!file.published}">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi" th:classappend="${file.published} ? 'bi-eye-slash' : 'bi-send-fill'"></i>
                            <span th:text="${file.published} ? 'Hide from students' : 'Publish to students'"></span>
                        </button>
                    </form>

                    <form th:action="@{/exams/{id}/paper/delete(id=${exam.id})}" method="post"
                          data-confirm="Delete this exam file?">
                        <button type="submit" class="btn btn-icon delete" title="Delete">
                            <i class="bi bi-trash-fill"></i></button>
                    </form>
                </div>
            </div>

            <!-- Preview -->
            <iframe class="ex-preview" th:if="${file.contentType == 'application/pdf'}"
                    th:src="@{/exams/{id}/paper/view(id=${exam.id})}" title="Exam preview"></iframe>
            <img class="ex-preview-img" th:if="${#strings.startsWith(file.contentType,'image/')}"
                 th:src="@{/exams/{id}/paper/view(id=${exam.id})}" alt="Exam preview">
        </div>
    </div>

    <!-- Upload -->
    <div class="card">
        <div class="card-header"><h3 th:text="${file == null} ? 'Upload the exam paper' : 'Replace the file'">Upload</h3></div>
        <div class="card-body">
            <form th:action="@{/exams/{id}/paper(id=${exam.id})}" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label>File (PDF, Word, ODT, TXT, PNG, JPG, max 10 MB) <span class="req">*</span></label>
                    <input type="file" name="file" required
                           accept=".pdf,.doc,.docx,.odt,.txt,.png,.jpg,.jpeg">
                </div>
                <div class="form-group">
                    <label style="display:flex;gap:.5rem;align-items:center">
                        <input type="checkbox" name="publish" value="true" th:checked="${file != null and file.published}">
                        Publish to the enrolled students now
                    </label>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-cloud-arrow-up-fill"></i> Upload</button>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
