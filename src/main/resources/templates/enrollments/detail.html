<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(#{enrollments.details.pageTitle}, ~{::main}, 'enrollments')}">
<body>
<main>
    <div class="page-header">
        <div>
            <h1><span th:text="#{enrollments.details.heading}">Enrollment</span> #<span th:text="${enrollment.id}"></span></h1>
            <div class="breadcrumb" th:text="#{enrollments.details.breadcrumb}">Home / Enrollments / Details</div>
        </div>
        <a th:href="@{/enrollments/edit/{id}(id=${enrollment.id})}" class="btn btn-primary">
            <i class="bi bi-pencil-fill"></i> <span th:text="#{btn.edit}">Edit</span>
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="form-grid">
                <div class="form-group"><label th:text="#{enrollments.studentId}">Student ID</label><span th:text="${enrollment.studentId}"></span></div>
                <div class="form-group"><label th:text="#{enrollments.courseId}">Course ID</label><span th:text="${enrollment.courseId}"></span></div>
                <div class="form-group"><label th:text="#{table.date}">Date</label>
                    <span th:text="${enrollment.enrollmentDate != null} ? ${#temporals.format(enrollment.enrollmentDate, 'dd/MM/yyyy')} : '-'"></span></div>
                <div class="form-group"><label th:text="#{table.grade}">Grade</label>
                    <span th:text="${enrollment.grade != null} ? ${enrollment.grade} : '-'"></span></div>
            </div>
            <div class="form-actions">
                <a th:href="@{/enrollments}" class="btn btn-light" th:text="#{btn.back}">Back</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
