<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Enrollment Details', ~{::main}, 'enrollments')}">
<body>
<main>
    <div class="page-header">
        <div>
            <h1>Enrollment #<span th:text="${enrollment.id}"></span></h1>
            <div class="breadcrumb">Home / Enrollments / Details</div>
        </div>
        <a th:href="@{/enrollments/edit/{id}(id=${enrollment.id})}" class="btn btn-primary">
            <i class="bi bi-pencil-fill"></i> Edit
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="form-grid">
                <div class="form-group"><label>Student ID</label><span th:text="${enrollment.studentId}"></span></div>
                <div class="form-group"><label>Course ID</label><span th:text="${enrollment.courseId}"></span></div>
                <div class="form-group"><label>Date</label>
                    <span th:text="${enrollment.enrollmentDate != null} ? ${#temporals.format(enrollment.enrollmentDate, 'dd/MM/yyyy')} : '-'"></span></div>
                <div class="form-group"><label>Grade</label>
                    <span th:text="${enrollment.grade != null} ? ${enrollment.grade} : '-'"></span></div>
            </div>
            <div class="form-actions">
                <a th:href="@{/enrollments}" class="btn btn-light">Back</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
