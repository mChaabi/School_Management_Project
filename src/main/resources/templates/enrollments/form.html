<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(#{enrollments.form.pageTitle}, ~{::main}, 'enrollments')}">
<body>
<main>
    <div class="page-header">
        <div>
            <h1 th:text="${enrollmentDto.id == null} ? #{enrollments.form.new} : #{enrollments.form.edit}"></h1>
            <div class="breadcrumb" th:text="#{enrollments.form.breadcrumb}">Home / Enrollments / Form</div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:object="${enrollmentDto}"
                  th:action="${enrollmentDto.id == null} ? @{/enrollments} : @{/enrollments/update/{id}(id=${enrollmentDto.id})}"
                  method="post">

                <div class="form-grid">
                    <div class="form-group">
                        <label><span th:text="#{table.student}">Student</span> <span class="req">*</span></label>
                        <select th:field="*{studentId}"
                                th:classappend="${#fields.hasErrors('studentId')} ? 'is-invalid'">
                            <option value="" th:text="#{form.selectStudent}">-- Select student --</option>
                            <option th:each="s : ${students}" th:value="${s.id}"
                                    th:text="${s.firstName + ' ' + s.lastName}"></option>
                        </select>
                        <span class="error-text" th:if="${#fields.hasErrors('studentId')}" th:errors="*{studentId}"></span>
                    </div>

                    <div class="form-group">
                        <label><span th:text="#{table.course}">Course</span> <span class="req">*</span></label>
                        <select th:field="*{courseId}"
                                th:classappend="${#fields.hasErrors('courseId')} ? 'is-invalid'">
                            <option value="" th:text="#{form.selectCourse}">-- Select course --</option>
                            <option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.title}"></option>
                        </select>
                        <span class="error-text" th:if="${#fields.hasErrors('courseId')}" th:errors="*{courseId}"></span>
                    </div>

                    <div class="form-group">
                        <label th:text="#{form.enrollmentDate}">Enrollment date</label>
                        <input type="date" th:field="*{enrollmentDate}"
                               th:classappend="${#fields.hasErrors('enrollmentDate')} ? 'is-invalid'">
                        <span class="error-text" th:if="${#fields.hasErrors('enrollmentDate')}" th:errors="*{enrollmentDate}"></span>
                    </div>

                    <div class="form-group">
                        <label th:text="#{table.grade}">Grade</label>
                        <input type="number" step="0.01" th:field="*{grade}"
                               th:classappend="${#fields.hasErrors('grade')} ? 'is-invalid'">
                        <span class="error-text" th:if="${#fields.hasErrors('grade')}" th:errors="*{grade}"></span>
                    </div>
                </div>

                <div class="form-actions">
                    <a th:href="@{/enrollments}" class="btn btn-light" th:text="#{btn.cancel}">Cancel</a>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> <span th:text="#{btn.save}">Save</span></button>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
