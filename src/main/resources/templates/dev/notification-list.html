<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(#{notif.title}, ~{::main}, 'notifications')}">
<body>
<main>
    <div class="page-header">
        <div>
            <h1 th:text="#{notif.heading}">Notifications</h1>
            <div class="breadcrumb" th:text="#{notif.breadcrumb}">Home / Notifications</div>
        </div>
        <form th:action="@{/notifications/read-all}" method="post" th:if="${unreadCount > 0}">
            <button type="submit" class="btn btn-light">
                <i class="bi bi-check2-all"></i> <span th:text="#{notif.markAllRead}">Mark all as read</span></button>
        </form>
    </div>

    <!-- Carousel -->
    <section class="nc" id="nc" th:unless="${page.empty}" aria-roledescription="carousel" aria-label="Notifications">
        <div class="nc-bar">
            <span class="nc-count"><strong id="ncCurrent">1</strong> <span th:text="#{carousel.of}">of</span> <span id="ncTotal" th:text="${page.content.size()}">1</span></span>
            <span class="nc-unread" th:if="${unreadCount > 0}">
                <i class="bi bi-circle-fill"></i> <span th:text="${unreadCount}">0</span> <span th:text="#{carousel.unread}">unread</span>
            </span>
        </div>

        <div class="nc-stage">
            <button type="button" class="nc-arrow" id="ncPrev" th:aria-label="#{carousel.prev}">
                <i class="bi bi-chevron-left"></i>
            </button>

            <div class="nc-viewport" id="ncViewport">
                <div class="nc-track" id="ncTrack">
                    <article class="nc-slide" th:each="n : ${page.content}">
                        <div class="nc-card"
                             th:classappend="'nc-' + ${n.type.color} + (${n.seen} ? '' : ' nc-unread-card')">
                            <div class="nc-icon"><i class="bi" th:classappend="${n.type.bellIcon}"></i></div>

                            <div class="nc-main">
                                <div class="nc-top">
                                    <h3 th:text="${n.type.emoji + ' ' + n.type.title}">Absence</h3>
                                    <span class="nc-badge nc-new" th:unless="${n.seen}" th:text="#{badge.new}">New</span>
                                    <span class="nc-badge" th:if="${n.aiGenerated}"><i class="bi bi-stars"></i> <span th:text="#{badge.ai}">AI</span></span>
                                </div>

                                <p class="nc-message" th:text="${n.message}">Message</p>

                                <div class="nc-foot">
                                    <span class="nc-time"><i class="bi bi-clock"></i>
                                        <span th:text="${#temporals.format(n.createdAt, 'dd/MM/yyyy HH:mm')}"></span></span>
                                    <a class="nc-open"
                                       th:href="@{/notifications/{id}/open(id=${n.id}, to=${n.link != null ? n.link : '/notifications'})}">
                                        <span th:text="#{notif.viewDetails}">View details</span> <i class="bi bi-arrow-right"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </article>
                </div>
            </div>

            <button type="button" class="nc-arrow" id="ncNext" th:aria-label="#{carousel.next}">
                <i class="bi bi-chevron-right"></i>
            </button>
        </div>

        <div class="nc-dots" id="ncDots" role="tablist" th:aria-label="#{carousel.choose}"></div>
    </section>

    <div class="card" th:if="${page.empty}">
        <div class="card-body empty"><i class="bi bi-bell-slash"></i> <span th:text="#{notif.empty.user}">You have no notifications.</span></div>
    </div>

    <!-- Older notifications (next server page) -->
    <div class="nc-pages" th:if="${page.totalPages > 1}">
        <a class="btn btn-light" th:if="${page.hasPrevious()}"
           th:href="@{/notifications(page=${page.number - 1})}"><i class="bi bi-arrow-left"></i> <span th:text="#{pagination.newer}">Newer</span></a>
        <span th:text="#{pagination.page} + ' ' + (${page.number + 1}) + ' ' + #{pagination.of} + ' ' + ${page.totalPages}"></span>
        <a class="btn btn-light" th:if="${page.hasNext()}"
           th:href="@{/notifications(page=${page.number + 1})}"><span th:text="#{pagination.older}">Older</span> <i class="bi bi-arrow-right"></i></a>
    </div>

    <!-- Botón de acceso directo al asistente de IA -->
    <div style="text-align: center; margin-top: 2rem; margin-bottom: 1rem;">
        <a th:href="@{/assistant}" class="btn btn-primary" style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.5rem; border-radius: 12px; font-weight: 600;">
            <i class="bi bi-stars"></i> <span th:text="#{notif.askAi}">Ask AI Assistant about your data</span>
        </a>
    </div>

</main>
</body>
</html>

<style>
    .nc{max-width:860px;margin:0 auto}
    .nc-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.9rem;
        color:#64748b;font-size:.9rem}
    .nc-count strong{color:#0f172a}
    .nc-unread{display:inline-flex;align-items:center;gap:.4rem;color:#b91c1c;font-weight:600}
    .nc-unread i{font-size:.5rem}

    .nc-stage{display:flex;align-items:center;gap:.9rem}
    .nc-viewport{flex:1;overflow:hidden;border-radius:16px;min-width:0}
    .nc-track{display:flex;transition:transform .45s cubic-bezier(.22,.8,.3,1);will-change:transform}
    .nc-slide{flex:0 0 100%;padding:2px;box-sizing:border-box}

    .nc-arrow{flex-shrink:0;width:46px;height:46px;border-radius:50%;border:1px solid #e2e8f0;
        background:#fff;color:#334155;font-size:1.1rem;display:flex;align-items:center;
        justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(15,23,42,.08);
        transition:background .2s,color .2s,transform .2s,box-shadow .2s}
    .nc-arrow:hover:not(:disabled){background:#4f46e5;color:#fff;border-color:#4f46e5;
        transform:scale(1.08);box-shadow:0 6px 16px rgba(79,70,229,.35)}
    .nc-arrow:active:not(:disabled){transform:scale(.96)}
    .nc-arrow:disabled{opacity:.35;cursor:not-allowed}
    .nc-arrow:focus-visible,.nc-dot:focus-visible,.nc-open:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px}

    .nc-card{display:flex;gap:1.25rem;background:#fff;border:1px solid #e2e8f0;border-left:6px solid #94a3b8;
        border-radius:16px;padding:1.75rem;min-height:210px;box-shadow:0 8px 24px rgba(15,23,42,.07);
        transition:box-shadow .25s,transform .25s}
    .nc-card:hover{box-shadow:0 14px 32px rgba(15,23,42,.12);transform:translateY(-2px)}
    .nc-icon{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;
        font-size:1.5rem;background:#f1f5f9;color:#475569;flex-shrink:0}
    .nc-main{flex:1;display:flex;flex-direction:column;min-width:0}
    .nc-top{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
    .nc-top h3{margin:0;font-size:1.1rem;color:#0f172a}
    .nc-message{margin:.7rem 0 1rem;color:#334155;font-size:1.02rem;line-height:1.6;flex:1}
    .nc-foot{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;
        padding-top:.9rem;border-top:1px solid #f1f5f9}
    .nc-time{color:#64748b;font-size:.85rem}
    .nc-open{font-weight:600;font-size:.9rem;color:#4f46e5;text-decoration:none;padding:.4rem .8rem;
        border-radius:8px;transition:background .2s}
    .nc-open:hover{background:#eef2ff}
    .nc-open i{transition:transform .2s}
    .nc-open:hover i{transform:translateX(3px)}

    .nc-badge{font-size:.7rem;font-weight:600;padding:.12rem .55rem;border-radius:99px;
        background:#e0e7ff;color:#4338ca}
    .nc-new{background:#fee2e2;color:#b91c1c}
    .nc-unread-card{background:linear-gradient(90deg,#fafaff,#fff 40%)}

    .nc-danger{border-left-color:#ef4444}  .nc-danger .nc-icon{background:#fee2e2;color:#dc2626}
    .nc-warning{border-left-color:#f59e0b} .nc-warning .nc-icon{background:#fef3c7;color:#d97706}
    .nc-success{border-left-color:#22c55e} .nc-success .nc-icon{background:#dcfce7;color:#16a34a}
    .nc-info{border-left-color:#0ea5e9}    .nc-info .nc-icon{background:#e0f2fe;color:#0284c7}
    .nc-primary{border-left-color:#4f46e5} .nc-primary .nc-icon{background:#e0e7ff;color:#4f46e5}

    .nc-dots{display:flex;justify-content:center;flex-wrap:wrap;gap:.5rem;margin-top:1.1rem}
    .nc-dot{width:9px;height:9px;border-radius:99px;border:0;padding:0;background:#cbd5e1;cursor:pointer;
        transition:width .3s,background .3s}
    .nc-dot:hover{background:#94a3b8}
    .nc-dot.active{width:28px;background:#4f46e5}

    .nc-pages{display:flex;justify-content:center;align-items:center;gap:1rem;margin-top:1.5rem;color:#64748b}

    @media (max-width:640px){
        .nc-arrow{width:38px;height:38px}
        .nc-stage{gap:.4rem}
        .nc-card{flex-direction:column;padding:1.25rem}
    }
    @media (prefers-reduced-motion:reduce){
        .nc-track,.nc-card,.nc-arrow,.nc-dot,.nc-open i{transition:none}
    }
</style>

<script>
    (function () {
        var track = document.getElementById('ncTrack');
        if (!track) return;

        var viewport = document.getElementById('ncViewport');
        var slides = track.children;
        var total = slides.length;
        var prev = document.getElementById('ncPrev');
        var next = document.getElementById('ncNext');
        var dotsBox = document.getElementById('ncDots');
        var current = document.getElementById('ncCurrent');
        var index = 0;

        var dots = [];
        if (total > 1 && total <= 12) {
            for (var i = 0; i < total; i++) {
                (function (i) {
                    var d = document.createElement('button');
                    d.type = 'button';
                    d.className = 'nc-dot';
                    d.setAttribute('aria-label', 'Go to notification ' + (i + 1));
                    d.addEventListener('click', function () { go(i); });
                    dotsBox.appendChild(d);
                    dots.push(d);
                })(i);
            }
        }

        function go(i) {
            index = Math.max(0, Math.min(total - 1, i));
            track.style.transform = 'translateX(' + (-index * 100) + '%)';
            current.textContent = index + 1;
            prev.disabled = index === 0;
            next.disabled = index === total - 1;
            dots.forEach(function (d, k) { d.classList.toggle('active', k === index); });
            for (var k = 0; k < total; k++) slides[k].setAttribute('aria-hidden', k === index ? 'false' : 'true');
        }

        prev.addEventListener('click', function () { go(index - 1); });
        next.addEventListener('click', function () { go(index + 1); });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowLeft') go(index - 1);
            if (e.key === 'ArrowRight') go(index + 1);
        });

        var startX = null;
        viewport.addEventListener('touchstart', function (e) { startX = e.touches[0].clientX; }, {passive: true});
        viewport.addEventListener('touchend', function (e) {
            if (startX === null) return;
            var dx = e.changedTouches[0].clientX - startX;
            if (Math.abs(dx) > 50) go(index + (dx < 0 ? 1 : -1));
            startX = null;
        });

        go(0);
    })();
</script>
</main>
</body>
</html>
