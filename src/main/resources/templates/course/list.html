<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(#{courses.title}, ~{::main}, 'courses')}">
<body>
<main>

    <div class="page-header">
        <div>
            <h1 th:text="#{courses.title}">Courses</h1>
            <div class="breadcrumb" th:text="#{courses.breadcrumb}">Home / Courses</div>
        </div>
        <a sec:authorize="hasAnyRole('ADMIN','TEACHER')" th:href="@{/export/grades.xlsx}" class="btn btn-light">
            <i class="bi bi-file-earmark-excel-fill"></i> <span th:text="#{btn.exportGrades}">Export grades</span></a>
        <a sec:authorize="hasAnyRole('ADMIN','TEACHER')" th:href="@{/export/grades.csv}" class="btn btn-light">
            <i class="bi bi-filetype-csv"></i> <span th:text="#{btn.csv}">CSV</span></a>
        <a th:href="@{/courses/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> <span th:text="#{courses.btn.new}">New Course</span>
        </a>
    </div>

    <div class="card">
        <div class="card-header">
            <h3><span th:text="#{courses.all}">All courses</span> <span class="badge badge-primary" th:text="${courses.totalElements}">0</span></h3>
            <form th:action="@{/courses}" method="get" class="search">
                <input type="text" name="keyword" th:value="${keyword}" th:placeholder="#{courses.search.placeholder}">
                <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i></button>
            </form>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>#</th>
                    <th th:text="#{table.title}">Title</th>
                    <th th:text="#{table.description}">Description</th>
                    <th th:text="#{table.credits}">Credits</th>
                    <th th:text="#{table.teacher}">Teacher</th>
                    <th th:text="#{table.actions}">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${courses.content}">
                    <td th:text="${c.id}"></td>
                    <td><strong th:text="${c.title}"></strong></td>
                    <td th:text="${c.description}"></td>
                    <td><span class="badge badge-info" th:text="${c.credits} + ' cr.'"></span></td>

                    <td th:text="${c.teacherName != null ? c.teacherName : (c.teacher != null ? c.teacher.fullName : '-')}"></td>

                    <td>
                        <div class="actions">
                            <a th:href="@{/courses/{id}/exams(id=${c.id})}" class="btn btn-icon edit" th:title="#{title.exams}">
                                <i class="bi bi-file-earmark-text"></i>
                            </a>

                            <a th:href="@{/courses/{id}/quizzes(id=${c.id})}" class="btn btn-icon edit" th:title="#{title.quizzes}">
                                <i class="bi bi-ui-checks"></i></a>

                            <a sec:authorize="hasAnyRole('ADMIN','TEACHER')"
                               th:href="@{/courses/{id}/grades(id=${c.id})}"
                               class="btn btn-icon edit" th:title="#{title.grades}">
                                <i class="bi bi-journal-check"></i>
                            </a>

                            <a th:href="@{/courses/edit/{id}(id=${c.id})}" class="btn btn-icon edit" th:title="#{title.edit}">
                                <i class="bi bi-pencil-fill"></i>
                            </a>

                            <form th:action="@{/courses/delete/{id}(id=${c.id})}" method="post"
                                  th:attr="data-confirm=#{courses.delete.confirm}">
                                <button type="submit" class="btn btn-icon delete" th:title="#{title.delete}">
                                    <i class="bi bi-trash-fill"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${courses.empty}">
                    <td colspan="6" class="empty">
                        <i class="bi bi-inbox"></i> <span th:text="#{courses.empty}">No courses found.</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:replace="~{fragments/pagination :: pagination(${courses}, '/courses', ${keyword})}"></div>
    </div>

</main>
</body>
</html>
