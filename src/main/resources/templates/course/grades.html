<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Course Grades', ~{::main}, 'courses')}">
<body>
<main>

    <div class="page-header">
        <div>
            <h1 th:text="'Grades: ' + ${courseTitle}">Course Grades</h1>
            <div class="breadcrumb">Home / Courses / Grades</div>
        </div>
    </div>

    <div class="card">
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Course</th>
                    <th>Teacher</th>
                    <th>Student</th>
                    <th>Exam Title</th>
                    <th>Note / Score</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="g : ${grades}">
                    <td th:text="${g.courseName}">Database Design</td>
                    <td th:text="${g.teacherName != null ? g.teacherName : 'N/A'}">Rahmouni Oussama</td>
                    <td th:text="${g.studentName}">John Doe</td>
                    <td th:text="${g.examTitle}">Midterm Exam</td>
                    <td>
                        <span th:if="${g.absent}" class="badge badge-danger">Absent</span>
                        <strong th:if="${!g.absent}"
                                th:text="${g.score != null ? g.score + ' / ' + g.maxScore : 'Not Graded Yet'}">
                            15.0 / 20.0
                        </strong>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(grades)}">
                    <td colspan="5" class="empty">No grades or exam results found for this course.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>
</body>
</html>
