<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Lesson Form', ~{::main}, 'schedules')}">
<body>
<main>
    <div class="page-header">
        <div>
            <h1 th:text="${scheduleDto.id == null} ? 'New lesson' : 'Edit lesson'"></h1>
            <div class="breadcrumb">Home / Timetable / Form</div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <!-- Conflict message from the service -->
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:each="e : ${#fields.globalErrors()}" th:text="${e}"></span>
            </div>

            <form th:object="${scheduleDto}"
                  th:action="${scheduleDto.id == null} ? @{/schedules} : @{/schedules/update/{id}(id=${scheduleDto.id})}"
                  method="post">

                <div class="form-grid">
                    <div class="form-group">
                        <label>Course <span class="req">*</span></label>
                        <select th:field="*{courseId}" th:classappend="${#fields.hasErrors('courseId')} ? 'is-invalid'">
                            <option value="">-- Select course --</option>
                            <option th:each="c : ${courses}" th:value="${c.id}" th:text="${c.title}"></option>
                        </select>
                        <span class="error-text" th:if="${#fields.hasErrors('courseId')}" th:errors="*{courseId}"></span>
                    </div>

                    <div class="form-group">
                        <label>Classroom <span class="req">*</span></label>
                        <select th:field="*{classroomId}" th:classappend="${#fields.hasErrors('classroomId')} ? 'is-invalid'">
                            <option value="">-- Select classroom --</option>
                            <option th:each="c : ${classrooms}" th:value="${c.id}" th:text="${c.name}"></option>
                        </select>
                        <span class="error-text" th:if="${#fields.hasErrors('classroomId')}" th:errors="*{classroomId}"></span>
                    </div>

                    <div class="form-group">
                        <label>Day <span class="req">*</span></label>
                        <select th:field="*{dayOfWeek}" th:classappend="${#fields.hasErrors('dayOfWeek')} ? 'is-invalid'">
                            <option value="">-- Select day --</option>
                            <option th:each="d : ${days}" th:value="${d}"
                                    th:text="${#strings.capitalize(#strings.toLowerCase(d))}"></option>
                        </select>
                        <span class="error-text" th:if="${#fields.hasErrors('dayOfWeek')}" th:errors="*{dayOfWeek}"></span>
                    </div>

                    <div class="form-group">
                        <label>Start time <span class="req">*</span></label>
                        <input type="time" th:field="*{startTime}" th:classappend="${#fields.hasErrors('startTime')} ? 'is-invalid'">
                        <span class="error-text" th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}"></span>
                    </div>

                    <div class="form-group">
                        <label>End time <span class="req">*</span></label>
                        <input type="time" th:field="*{endTime}" th:classappend="${#fields.hasErrors('endTime')} ? 'is-invalid'">
                        <span class="error-text" th:if="${#fields.hasErrors('endTime')}" th:errors="*{endTime}"></span>
                    </div>
                </div>

                <div class="form-actions">
                    <a th:href="@{/schedules}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save</button>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
