<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header class="topbar" th:fragment="topbar(title)">
    <div class="topbar-left">
        <button class="icon-btn" id="menuToggle" aria-label="Toggle menu">
            <i class="bi bi-list"></i>
        </button>
        <h2 class="topbar-title" th:text="${title}">Title</h2>
    </div>

    <div class="topbar-right" style="display: flex; align-items: center; gap: 0.75rem;">

        <!-- Language Switcher Buttons -->
        <div class="lang-selector" style="display: flex; gap: 0.2rem;">
            <a th:href="@{''(lang='en')}" class="btn btn-sm btn-light" style="padding: 0.2rem 0.4rem; font-size: 0.75rem;">EN</a>
            <a th:href="@{''(lang='fr')}" class="btn btn-sm btn-light" style="padding: 0.2rem 0.4rem; font-size: 0.75rem;">FR</a>
            <a th:href="@{''(lang='es')}" class="btn btn-sm btn-light" style="padding: 0.2rem 0.4rem; font-size: 0.75rem;">ES</a>
            <a th:href="@{''(lang='ar')}" class="btn btn-sm btn-light" style="padding: 0.2rem 0.4rem; font-size: 0.75rem;">AR</a>
        </div>

        <a th:href="@{/notifications}" class="icon-btn bell-link" aria-label="Notifications" title="Notifications"
           th:with="unread=${@notificationRepository.countByRecipientUsernameAndSeenFalse(#authentication.name)}">
            <i class="bi bi-bell"></i>
            <span class="bell-badge" th:if="${unread > 0}"
                  th:text="${unread > 99 ? '99+' : unread}">3</span>
        </a>

        <div class="user">
            <div class="avatar"
                 th:text="${#strings.toUpperCase(#strings.substring(#authentication.name, 0, 1))}">A</div>

            <div class="user-info">
                <strong sec:authentication="name">username</strong>
                <small>
                    <span sec:authorize="hasRole('ADMIN')">Administrator</span>
                    <span sec:authorize="hasRole('TEACHER')">Teacher</span>
                    <span sec:authorize="hasRole('STUDENT')">Student</span>
                    <span sec:authorize="hasRole('PARENT')">Parent</span>
                </small>
            </div>
        </div>

        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit" class="icon-btn logout-btn" title="Logout" aria-label="Logout">
                <i class="bi bi-box-arrow-right"></i>
            </button>
        </form>
    </div>
</header>
</body>
</html>
