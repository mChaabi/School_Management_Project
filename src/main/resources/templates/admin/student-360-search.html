<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(#{admin360.title}, ~{::main}, 'admin360')}">
<body>
<main>
  <div class="page-header">
    <div>
      <h1 th:text="#{admin360.title}">Student 360</h1>
      <div class="breadcrumb" th:text="#{admin360.breadcrumb}">Home / Administration / Student file</div>
    </div>
  </div>

  <div class="card">
    <div class="card-header" style="position: relative;">
      <form th:action="@{/admin/student-360}" method="get" class="search ac-wrap" autocomplete="off">
        <input type="text" id="acInput" name="keyword" th:value="${keyword}"
               th:placeholder="#{students.search.placeholder}">
        <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i></button>
        <ul id="acList" class="ac-list" hidden></ul>
      </form>
    </div>

    <div class="table-wrap" th:if="${results != null}">
      <table>
        <thead><tr><th>#</th><th th:text="#{table.name}">Name</th><th th:text="#{table.email}">Email</th><th></th></tr></thead>
        <tbody>
        <tr th:each="s : ${results.content}">
          <td th:text="${s.id}"></td>
          <td><strong th:text="${s.firstName + ' ' + s.lastName}"></strong></td>
          <td th:text="${s.email}"></td>
          <td><a class="btn btn-primary" th:href="@{/admin/student-360/{id}(id=${s.id})}"
                 th:text="#{admin360.open}">Open file</a></td>
        </tr>
        <tr th:if="${results.empty}"><td colspan="4" class="empty" th:text="#{students.empty}">No students found.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Inline CSS & JavaScript for Live Autocomplete -->
  <style>

    .ac-wrap { position: relative; }
    .ac-list {
      position: absolute; top: 100%; left: 0; right: 0; z-index: 50;
      margin: 4px 0 0; padding: 4px; list-style: none;
      background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,.12); max-height: 320px; overflow-y: auto;
    }
    .ac-item { padding: 8px 12px; border-radius: 8px; cursor: pointer; }
    .ac-item:hover, .ac-item.active { background: #eef2ff; }
    .ac-item small { display: block; color: #6b7280; }
    .ac-empty { padding: 8px 12px; color: #6b7280; }
    .suggestions-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      z-index: 1000;
      max-height: 250px;
      overflow-y: auto;
    }
    .suggestion-item {
      padding: 10px 16px;
      cursor: pointer;
      border-bottom: 1px solid #f3f4f6;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: #1f2937;
    }
    .suggestion-item:hover {
      background-color: #f9fafb;
      color: #4f46e5;
    }
    .suggestion-item small {
      color: #6b7280;
    }
  </style>


  <script th:inline="javascript">
    (function () {
      const input = document.getElementById('acInput');
      const list  = document.getElementById('acList');
      const base  = /*[[@{/admin/student-360}]]*/ '/admin/student-360';
      let timer = null, items = [], active = -1;

      function close() { list.hidden = true; list.innerHTML = ''; active = -1; }

      function render(data) {
        list.innerHTML = '';
        items = [];
        if (data.length === 0) {
          const li = document.createElement('li');
          li.className = 'ac-empty';
          li.textContent = '—';
          list.appendChild(li);
        }
        data.forEach(s => {
          const li = document.createElement('li');
          li.className = 'ac-item';
          const strong = document.createElement('strong');
          strong.textContent = s.fullName;
          const small = document.createElement('small');
          small.textContent = s.email + (s.classroomName ? ' · ' + s.classroomName : '');
          li.append(strong, small);
          li.addEventListener('mousedown', () => go(s.id));
          list.appendChild(li);
          items.push(li);
        });
        list.hidden = false;
      }

      function go(id) { window.location.href = base + '/' + id; }

      function setActive(i) {
        items.forEach(li => li.classList.remove('active'));
        active = i;
        if (items[active]) {
          items[active].classList.add('active');
          items[active].scrollIntoView({ block: 'nearest' });
        }
      }

      input.addEventListener('input', () => {
        clearTimeout(timer);
        const q = input.value.trim();
        if (q.length < 2) { close(); return; }
        timer = setTimeout(async () => {
          try {
            const res = await fetch(base + '/suggest?q=' + encodeURIComponent(q),
                    { headers: { 'Accept': 'application/json' } });
            if (!res.ok) { close(); return; }
            render(await res.json());
          } catch (e) { close(); }
        }, 250);   // debounce: espera 250 ms después de dejar de escribir
      });

      input.addEventListener('keydown', e => {
        if (list.hidden || items.length === 0) return;
        if (e.key === 'ArrowDown') { e.preventDefault(); setActive((active + 1) % items.length); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); setActive((active - 1 + items.length) % items.length); }
        else if (e.key === 'Enter' && active >= 0) { e.preventDefault(); items[active].dispatchEvent(new Event('mousedown')); }
        else if (e.key === 'Escape') close();
      });

      input.addEventListener('blur', () => setTimeout(close, 150));
    })();
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const input = document.getElementById('studentSearchInput');
      const dropdown = document.getElementById('searchSuggestions');

      let timeout = null;

      input.addEventListener('input', function() {
        clearTimeout(timeout);
        const query = this.value.trim();

        if (query.length < 1) {
          dropdown.style.display = 'none';
          dropdown.innerHTML = '';
          return;
        }

        // Debounce request to avoid hammering backend on every keypress
        timeout = setTimeout(() => {
          fetch(`/admin/student-360/search-ajax?keyword=${encodeURIComponent(query)}`)
                  .then(response => response.json())
                  .then(data => {
                    dropdown.innerHTML = '';
                    if (data && data.length > 0) {
                      data.forEach(student => {
                        const item = document.createElement('a');
                        item.className = 'suggestion-item';
                        item.href = `/admin/student-360/${student.id}`;
                        item.innerHTML = `<span><strong>${student.firstName} ${student.lastName}</strong></span> <small>${student.email}</small>`;
                        dropdown.appendChild(item);
                      });
                      dropdown.style.display = 'block';
                    } else {
                      dropdown.style.display = 'none';
                    }
                  })
                  .catch(err => console.error('Error fetching search suggestions:', err));
        }, 200);
      });

      // Hide dropdown when clicking outside
      document.addEventListener('click', function(e) {
        if (!input.contains(e.target) && !dropdown.contains(e.target)) {
          dropdown.style.display = 'none';
        }
      });
    });
  </script>
</main>
</body>
</html>
